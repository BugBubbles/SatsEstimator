experiment_name: indoor_flying1
seed: 0

paths:
  data_root: /path/to/datasets/ELOPE
  sequences: 0023
  output_root: ./results
  suffix: 0023_elope_sn_tn

data:
  time_window: 0.5
  event_count: 30000
  unit_count: 5000
  adaptive_split: true
  max_events: 200000000000
  grid_size: 20

camera:
  width: 200
  height: 200

solver:
    max_iters: 200
    convergence_thresh: 1e-6
    regularization: 0 # 10 is for trans only
    lr: 1.0
    decay: 0.98
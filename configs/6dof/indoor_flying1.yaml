paths:
  data_root: /home/temp/cbf_datasets/MVSEC
  sequences: indoor_flying1
  output_root: ./results
  suffix: indoor_flying1

data:
  time_window: 0.05
  event_count: 30000
  unit_count: 2000
  adaptive_split: true
  max_events: 200000000000
  grid_size: 20

camera:
  width: 346
  height: 260

solver:
    max_iters: 200
    convergence_thresh: 1e-6
    regularization: 0 # 10 is for trans only
    lr: 1.0
    decay: 0.98
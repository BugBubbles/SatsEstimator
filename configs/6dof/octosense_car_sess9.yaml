# an upper bound and is kept below the requested 50k-event limit.
paths:
  data_root: /home/chenbofei/Code/PolyEventEstimator/artifacts/ablation_data_20260919/Octosense
  sequences: car_sess9
  output_root: ./octosense
  suffix: car_sess9

